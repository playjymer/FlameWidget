<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlameWidget — Открытие виджета</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #141210;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #231e1b;
            border-radius: 28px;
            padding: 36px 24px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
        }
        p {
            color: #bbb;
            font-size: 14px;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        .btn {
            display: block;
            background: #ff7043;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            padding: 16px 24px;
            border-radius: 18px;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(255,112,67,0.45);
            transition: transform 0.15s, opacity 0.15s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-sub {
            display: inline-block;
            background: rgba(255,255,255,0.08);
            color: #ffab91;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 14px;
            text-decoration: none;
            margin-top: 14px;
        }
    </style>
    <script>
        function openWidget() {
            var params = new URLSearchParams(window.location.search);
            var widgetUrl = params.get('url');
            if (widgetUrl) {
                var deepLink = "flamewidget://widget?url=" + encodeURIComponent(widgetUrl);
                var btn = document.getElementById('openBtn');
                if (btn) btn.href = deepLink;
                // Auto trigger intent
                window.location.href = deepLink;
            }
        }
        window.addEventListener('DOMContentLoaded', openWidget);
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">🔥</div>
        <h2>FlameWidget</h2>
        <p>Нажмите кнопку ниже, чтобы открыть этот виджет в приложении и добавить его на рабочий стол:</p>
        <a id="openBtn" class="btn" href="#">📱 Открыть в FlameWidget</a>
        <br>
        <a class="btn-sub" href="https://github.com/playjymer/FlameWidget/releases/latest">⬇️ Скачать приложение</a>
    </div>
</body>
</html>
